name: Check exported analysis metrics
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 numpy==2.3.5
      - run: python scripts/verify_metrics.py
